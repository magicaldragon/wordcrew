<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WordCrew — Only Talented Guessers</title>
  <meta name="description" content="A classroom word game for 2+ players: one describes, the crew guesses. Normal, Hell and Team modes.">
  <meta name="theme-color" content="#1A1A2E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WordCrew">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <script>
    // Runs before React mounts so the portal never flashes the wrong theme.
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var dark = saved
          ? saved === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {
        /* blocked storage — keep the default light theme */
      }
    })();
  </script>
  <style>
    * {
      caret-color: transparent;
    }
    html, body, #root {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden; /* Prevent scrolling on body */
    }
    body {
      font-family: 'Exo 2', sans-serif;
      background-color: #1A1A2E; /* dark-metal */
      color: #EAEAEA; /* light-text */
    }
    .countdown-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 50; 
      font-family: 'Orbitron', sans-serif;
      width: 100%; 
      text-align: center; 
    }
    /* Custom scrollbar for a more futuristic feel (for internal scroll areas) */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #1A1A2E; /* dark-metal */
    }
    ::-webkit-scrollbar-thumb {
      background: #5E2ABF; /* cyber-purple */
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #00FFFF; /* electric-blue */
    }
    .futuristic-button {
      transition: all 0.3s ease-in-out;
      border: 1px solid rgba(0, 255, 255, 0.3); /* electric-blue border */
    }
    .futuristic-button:hover:not(:disabled) {
      box-shadow: 0 0 15px 2px rgba(0, 255, 255, 0.6); /* electric-blue glow */
      transform: translateY(-2px) scale(1.02);
    }
     .futuristic-button:focus-visible:not(:disabled) { /* Added focus-visible state */
      outline: none;
      box-shadow: 0 0 18px 4px rgba(0, 255, 255, 0.7); /* Brighter glow for focus */
      transform: translateY(-2px) scale(1.03);
    }
    /* Wide buttons that sit flush with a scrollable panel edge: keep the lift + glow
       but skip the horizontal scale, which used to overflow the panel, spawn a
       horizontal scrollbar and clip the button on hover. */
    .futuristic-button.hover-lift:hover:not(:disabled) {
      transform: translateY(-2px);
    }
    .futuristic-button.hover-lift:focus-visible:not(:disabled) {
      transform: translateY(-2px);
    }
    .futuristic-button:disabled {
      border-color: rgba(160, 160, 184, 0.3); /* muted-text border */
      background-image: none;
      background-color: rgba(160, 160, 184, 0.2);
      cursor: not-allowed;
    }
    .futuristic-input {
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 255, 255, 0.3); /* electric-blue border */
      color: #EAEAEA; /* light-text */
      transition: all 0.3s ease;
    }
    .futuristic-input:focus, .futuristic-input:focus-visible { /* Added focus-visible for consistency */
      background-color: rgba(255, 255, 255, 0.1);
      border-color: #00FFFF; /* electric-blue */
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
      outline: none;
    }
    .futuristic-card {
      background: rgba(42, 42, 78, 0.6); /* Darker translucent */
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 255, 255, 0.2); /* electric-blue subtle border, might be overridden by specific card styles */
      box-shadow: 0 8px 32px 0 rgba(0, 255, 255, 0.1); /* Subtle glow */
    }
    .results-card-animation {
      animation: rgbBorderAnimation 4s linear infinite;
      border-width: 2px !important; 
    }
    .cat-animation-container {
      z-index: 40; 
      pointer-events: none; 
    }

    /* Styling for select dropdown options */
    select.futuristic-input option {
      background-color: #1A1A2E; /* dark-metal */
      color: #EAEAEA; /* light-text */
      padding: 8px; /* Add some padding to options */
    }

    select.futuristic-input option:hover {
      background-color: #5E2ABF; /* cyber-purple */
      color: #FFFFFF; /* Brighter text on hover */
    }
    /* For Firefox, which needs a slightly different approach for option background */
    select.futuristic-input:-moz-focusring option {
        background-color: #1A1A2E;
    }
    select.futuristic-input:focus option:checked { /* Style the selected option in the dropdown */
        background: #5E2ABF;
        color: #FFFFFF;
    }
    /* Custom Checkbox Styling */
    .custom-checkbox {
      appearance: none;
      background-color: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(0, 255, 255, 0.3);
      padding: 0;
      display: inline-block;
      position: relative;
      width: 1.25em; /* 20px */
      height: 1.25em; /* 20px */
      border-radius: 0.25rem; /* 4px */
      cursor: pointer;
      margin-right: 0.5em;
      vertical-align: middle;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }
    .custom-checkbox:checked {
      background-color: #39FF14; /* neon-green */
      border-color: #39FF14;
    }
    .custom-checkbox:checked::after {
      content: '✔';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #1A1A2E; /* dark-metal for checkmark */
      font-size: 0.875em; /* 14px */
      font-weight: bold;
    }
    .custom-checkbox:focus, .custom-checkbox:focus-visible { /* Added focus-visible */
      outline: none;
      box-shadow: 0 0 0 2px rgba(0, 255, 255, 0.5); /* electric-blue focus ring */
    }
    
    /* Enhanced Timer Freeze Visual */
    .timer-frozen-display {
      background: linear-gradient(145deg, rgba(173, 216, 230, 0.5), rgba(100, 149, 237, 0.6)); /* Light frosty blues */
      border: 2px solid rgba(200, 240, 255, 0.7);
      border-radius: 0.375rem; /* Tailwind's rounded-md */
      padding: 0.1rem 0.4rem; /* Tailwind's px-1.5 py-0.5 roughly */
      box-shadow: 0 0 8px 2px rgba(0, 220, 255, 0.3), /* Outer glow */
                  inset 0 0 6px rgba(220, 240, 255, 0.4); /* Inner frost */
      display: inline-flex; 
      align-items: center;
      text-shadow: 0 0 3px rgba(255,255,255,0.5);
      animation: frostyPulse 2s infinite ease-in-out;
    }

    .word-animation-container {
      position: relative; 
      display: flex; 
      align-items: center;
      justify-content: center;
      width: 100%; 
      height: 100%; /* Ensure it fills parent if parent has defined height */
    }
    
    .timer-rush-hour { /* This style is for the rectangular border around the timer in Normal mode - REMOVED */
      /* border: 2px solid #FF4136; */ /* danger-red */
      /* box-shadow: 0 0 10px 2px rgba(255, 65, 54, 0.6), inset 0 0 8px rgba(255, 65, 54, 0.4); */
      /* animation: pulseOnce 0.7s infinite alternate; */ 
    }

    /* Rush Hour Active Visuals - Main card styling and pseudo-element for running border */
    .rush-hour-active-visuals {
      position: relative; /* For pseudo-element positioning */
      animation: rushHourGlowKeyframes 0.7s infinite ease-in-out;
    }

    @keyframes runningBorderBarsAnimInternal {
      to {
        background-position: 33.94px 0; /* Adjusted for 12px bar thickness: (12px red + 12px transparent) * sqrt(2) for 45deg */
      }
    }

    .rush-hour-active-visuals::before {
      content: "";
      position: absolute;
      inset: 0; 
      border-radius: 0.75rem; /* Tailwind's rounded-xl */
      padding: 3px; /* Thickness of the border visual */
      background: repeating-linear-gradient(
        45deg,
        #FF4136, 
        #FF4136 12px, /* Thicker red bar */
        transparent 12px,
        transparent 24px /* Total pattern element width is 24px before rotation scaling */
      );
      background-size: 33.94px 33.94px; /* 24px * sqrt(2) to make pattern align correctly at 45deg */
      animation: runningBorderBarsAnimInternal 0.25s linear infinite; /* Much Faster animation */
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box, 
        linear-gradient(#fff 0 0); 
      -webkit-mask-composite: xor; 
              mask-composite: exclude; 
      pointer-events: none; 
      z-index: 0; 
    }

    /* Word Card Animated Border "Water Flow" Effect */
    @keyframes waterBorderFlowAnim {
      to { background-position: 400% center; } /* Animates horizontal position of a wide gradient */
    }

    .word-card-animated-border {
      position: relative;
      border: 2px solid transparent !important; /* Overrides .futuristic-card border, space for pseudo-element */
      background-clip: padding-box !important; /* Element's background won't draw into the border area */
    }

    .word-card-animated-border::before {
      content: "";
      position: absolute;
      inset: -2px; /* Makes pseudo-element cover the parent's border area */
      border-radius: inherit; /* Inherits from parent (e.g., rounded-xl) */
      padding: 2px; /* This becomes the actual animated border thickness */
      background: linear-gradient(90deg, 
        #00FFFF, #39FF14, #5E2ABF, #FF4136, 
        #00FFFF, #39FF14, #5E2ABF, #FF4136, 
        #00FFFF); /* Repeating gradient for smooth looping. Ensure first and last color match for seamless cycle if needed or use enough colors for full cycle */
      background-size: 300% 100%; /* Gradient pattern width. Adjust for number of color stops for a full cycle. */
      animation: waterBorderFlowAnim 4s linear infinite; /* Controls the speed of the "flow" */
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box, /* Transparent content area */
        linear-gradient(#fff 0 0);             /* Solid full area */
      -webkit-mask-composite: xor;           /* XOR to punch out the content area */
              mask-composite: exclude;       /* Standard equivalent */
      pointer-events: none;
      z-index: 0; /* Ensure it's behind content if card has its own direct content without padding */
    }
    
    /* Hell Mode Time Bar Styling */
    .hell-mode-timebar-container {
        position: relative;
        background-color: rgb(55 65 81 / 1); /* bg-gray-700 */
        border-radius: 9999px; /* rounded-full */
        height: 0.75rem; /* h-3 */
        box-shadow: inset 0 2px 4px 0 rgb(0 0 0 / 0.05); /* shadow-inner */
        overflow: hidden;
        border: 2px solid;
        animation: hellTimebarGlow 2s infinite ease-in-out;
    }
    .hell-mode-timebar-container.time-depleted-spark::after {
        content: '';
        position: absolute;
        left: 4px;
        top: 50%;
        width: 1rem;
        height: 1rem;
        background: radial-gradient(circle, white, #FFDC00, #FF851B, transparent 70%);
        border-radius: 50%;
        animation: timeDepletedSpark 0.8s ease-out forwards;
    }
    
    /* --- Responsive Layout & Typography --- */
    /* Base font sizes are set via Tailwind classes on elements. The rules below enhance them for fluid scaling. */
    header h1 {
        /* From text-3xl (1.875rem) to md:text-5xl (3rem) */
        font-size: clamp(1.875rem, 6vw, 3rem);
    }
    header p {
        /* From text-md (0.875rem) to sm:text-lg (1.125rem) */
        font-size: clamp(0.875rem, 3vw, 1.125rem);
    }
    main.futuristic-card {
        /* From p-3 (0.75rem) to md:p-6 (1.5rem), with a higher max for large screens */
        padding: clamp(0.75rem, 3vh, 2rem);
    }

    /* --- Component-Specific Responsive Styles --- */
    .instruction-screen-title, .setup-screen-title {
        /* From text-2xl (1.5rem) to sm:text-3xl (1.875rem) */
        font-size: clamp(1.5rem, 5vw, 2.25rem) !important;
    }
    .instruction-screen-content, .setup-screen-label, .setup-screen-input, .setup-screen-checkbox-label, .setup-screen-small-text {
        font-size: clamp(0.875rem, 2.5vw, 1.1rem) !important;
    }
    .instruction-buttons button, .setup-screen-button, .home-button {
        font-size: clamp(1rem, 3vw, 1.25rem) !important;
        padding: clamp(0.75rem, 2.5vh, 1.25rem) !important;
    }

    .gamescreen-buttons button {
        padding: clamp(0.75rem, 3vh, 1.25rem) !important;
        font-size: clamp(1rem, 3vw, 1.25rem) !important;
    }
    .score-display {
        font-size: clamp(1rem, 3vw, 1.25rem) !important;
    }
    .score-display span {
        font-size: clamp(1.25rem, 4vw, 1.875rem) !important;
    }
    .game-message-display {
        font-size: clamp(1.1rem, 4vw, 1.75rem) !important;
    }
    .hell-mode-timebar-container {
        height: clamp(0.75rem, 2vh, 1.25rem); /* h-3 to h-5 */
    }

    .results-screen-title {
        font-size: clamp(2rem, 6vw, 3.75rem) !important; /* From ~3xl to ~6xl */
    }
    .final-score {
        font-size: clamp(4rem, 18vw, 10rem) !important; /* From ~6xl up */
    }
    .score-breakdown, .compliment-message {
        font-size: clamp(1rem, 3vw, 1.5rem) !important;
    }
    .setup-screen-input {
        padding-top: clamp(0.5rem, 2vh, 1rem) !important;
        padding-bottom: clamp(0.5rem, 2vh, 1rem) !important;
    }
    .custom-checkbox {
        width: clamp(1.25em, 4vw, 1.5em) !important;
        height: clamp(1.25em, 4vw, 1.5em) !important;
    }
    .custom-checkbox:checked::after {
        font-size: clamp(0.875em, 3vw, 1.1em) !important;
    }
    
    /* --- Orientation-Specific Optimizations --- */
    @media (orientation: landscape) and (max-height: 550px) {
        /* Make layout more compact vertically for short, wide screens */
        header {
            margin-bottom: 0.5rem !important; /* Tailwind sm:mb-4 is 1rem */
        }
        header h1 {
            font-size: clamp(1.5rem, 8vh, 2rem) !important;
        }
        header p {
            font-size: clamp(0.75rem, 4vh, 0.875rem) !important;
            margin-top: 0 !important;
            line-height: 1.2;
        }
        footer {
            margin-top: 0.5rem !important;
            flex-direction: row !important;
            flex-wrap: wrap; /* Allow wrapping on very narrow landscape screens */
            justify-content: center;
        }
        main.futuristic-card {
             padding: clamp(0.5rem, 2vh, 1rem) !important;
        }

        /* Reduce button sizes */
        .setup-screen-button, .home-button, .instruction-buttons button, .gamescreen-buttons button {
            padding: clamp(0.5rem, 2vh, 0.75rem) !important;
            font-size: clamp(0.8rem, 3vh, 1rem) !important;
        }
        
        /* Shrink the giant word/score text based on limited height */
        /* This rule targets the <p> tag generated inside WordCard */
        .word-card-animated-border p {
            font-size: clamp(2rem, 25vh, 6rem) !important;
        }

        .final-score {
            font-size: clamp(3rem, 25vh, 7rem) !important;
        }
    }

    /* --- Fullscreen Mode Overrides --- */
    body.fullscreen-active #root > div {
        padding: 0;
        justify-content: center;
        align-items: center;
    }
    body.fullscreen-active .container {
        width: 100vw;
        height: calc(100vw * 9 / 16);
        max-height: 100vh;
        max-width: calc(100vh * 16 / 9);
        margin: auto;
        padding: 2vmin;
    }
    body.fullscreen-active header {
        margin-bottom: 1vmin !important;
    }
    body.fullscreen-active header h1 {
        font-size: clamp(2rem, 5vmin, 3.5rem) !important;
    }
    body.fullscreen-active header p {
        font-size: clamp(1rem, 2.5vmin, 1.25rem) !important;
    }
    body.fullscreen-active main.futuristic-card {
        padding: clamp(0.5rem, 2vmin, 1.5rem) !important;
    }

    body.fullscreen-active .setup-screen-title {
        font-size: clamp(1.75rem, 4.5vmin, 2.5rem) !important;
    }
    body.fullscreen-active .setup-screen-label,
    body.fullscreen-active .setup-screen-input,
    body.fullscreen-active .setup-screen-checkbox-label,
    body.fullscreen-active .setup-screen-small-text {
        font-size: clamp(0.9rem, 2.2vmin, 1.1rem) !important;
    }
    body.fullscreen-active .setup-screen-button,
    body.fullscreen-active .home-button,
    body.fullscreen-active .gamescreen-buttons button {
        font-size: clamp(1rem, 2.5vmin, 1.25rem) !important;
        padding: clamp(0.75rem, 2vmin, 1.25rem) !important;
    }
    body.fullscreen-active .score-display {
        font-size: clamp(1rem, 2.5vmin, 1.25rem) !important;
    }
    body.fullscreen-active .score-display span {
        font-size: clamp(1.25rem, 3.5vmin, 1.875rem) !important;
    }
    body.fullscreen-active .game-message-display {
        font-size: clamp(1.1rem, 3vmin, 1.75rem) !important;
    }
    body.fullscreen-active .results-screen-title {
        font-size: clamp(2rem, 5vmin, 3.75rem) !important;
    }
    body.fullscreen-active .final-score {
        font-size: clamp(4rem, 18vmin, 10rem) !important;
    }
    body.fullscreen-active .score-breakdown, 
    body.fullscreen-active .compliment-message {
        font-size: clamp(1rem, 3vmin, 1.5rem) !important;
    }

    /* Instruction Screen Font Size Increase for TV Readability */
    body.fullscreen-active .instruction-screen-title {
        font-size: clamp(2rem, 6vmin, 4rem) !important;
    }
    body.fullscreen-active .instruction-screen-content {
        font-size: clamp(1.2rem, 3.5vmin, 2.2rem) !important;
        line-height: 1.6 !important;
    }
    body.fullscreen-active .instruction-screen-content h3 {
        font-size: clamp(1.5rem, 4.5vmin, 2.8rem) !important;
        margin-bottom: 0.75rem !important;
    }
    body.fullscreen-active .instruction-buttons button {
        font-size: clamp(1.2rem, 3vmin, 1.8rem) !important;
        padding: clamp(1rem, 2.5vmin, 2rem) !important;
    }
    
    /* Footer Repositioning for Fullscreen */
    body.fullscreen-active footer {
        position: fixed;
        bottom: 2vmin;
        right: 2vmin;
        width: auto;
        flex-direction: column;
        align-items: flex-end;
        background-color: rgba(26, 26, 46, 0.7);
        backdrop-filter: blur(5px);
        padding: 1.5vmin;
        border-radius: 0.75rem;
        border: 1px solid rgba(0, 255, 255, 0.2);
        z-index: 100;
        margin: 0;
    }
    /* Hide non-essential footer elements in fullscreen */
    body.fullscreen-active footer .footer-credit,
    body.fullscreen-active footer .fullscreen-toggle-container {
        display: none;
    }
    /* Adjust the volume controls container */
    body.fullscreen-active footer .volume-controls-container {
        flex-direction: column;
        align-items: flex-end;
        gap: 1vmin;
    }
    body.fullscreen-active footer .volume-control-item {
        width: 100%;
        justify-content: flex-end;
    }
    body.fullscreen-active footer .volume-control-item label {
        font-size: 2vmin;
    }
    body.fullscreen-active footer .volume-control-item input[type="range"] {
        width: 15vmin;
    }
    body.fullscreen-active footer .volume-control-item span {
        font-size: 2vmin;
        width: 6vmin;
    }

  </style>
</head>
<body class="bg-dark-metal text-light-text">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
