<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WordCrew — Only Talented Guessers</title>
  <meta name="description" content="A classroom word game for 2+ players: one describes, the crew guesses. Normal, Hell and Team modes.">
  <meta name="theme-color" content="#0d0d14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WordCrew">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <script>
    // Runs before React mounts so the tab title and <html lang> are already right, and a
    // Vietnamese device never flashes the English title. Mirrors readInitialLanguage()
    // in contexts/LanguageContext.tsx — change the rule in both places.
    (function () {
      var titles = {
        en: 'WordCrew — Only Talented Guessers',
        vi: 'WordCrew — Chỉ dành cho cao thủ đoán từ'
      };
      try {
        var saved = localStorage.getItem('wordcrew_language_v1');
        var lang = saved === 'vi' || saved === 'en'
          ? saved
          : (navigator.language || '').toLowerCase().indexOf('vi') === 0 ? 'vi' : 'en';
        document.documentElement.lang = lang;
        document.title = titles[lang];
      } catch (e) {
        /* blocked storage — the English defaults above stay */
      }
    })();
  </script>
  <script>
    // Runs before React mounts so the portal never flashes the wrong theme.
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var dark = saved
          ? saved === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {
        /* blocked storage — keep the default light theme */
      }
    })();
  </script>
  <style>
    * {
      caret-color: transparent;
    }
    html, body, #root {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden; /* Prevent scrolling on body */
    }
    body {
      font-family: 'Exo 2', sans-serif;
      background-color: #0d0d14; /* dark-metal (ink-0) */
      color: #E8EAF0; /* light-text */
    }
    .countdown-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 50; 
      font-family: 'Orbitron', sans-serif;
      width: 100%; 
      text-align: center; 
    }
    /* Custom scrollbar for a more futuristic feel (for internal scroll areas) */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0d0d14; /* dark-metal (ink-0) */
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.14);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.26);
    }
    /* Shared control language: a solid shape with a hairline edge and a real
       elevation shadow. Hover raises it one step; focus shows a ring, not a glow. */
    .futuristic-button {
      transition: transform 140ms cubic-bezier(0.2, 0, 0, 1), box-shadow 160ms ease,
        background-color 160ms ease, border-color 160ms ease, color 160ms ease;
      border: 1px solid var(--hairline-strong);
      box-shadow: var(--elev-1);
    }
    .futuristic-button:hover:not(:disabled) {
      box-shadow: var(--elev-2);
      transform: translateY(-1px);
    }
    .futuristic-button:focus-visible:not(:disabled) {
      outline: none;
      box-shadow: var(--elev-2), 0 0 0 3px rgba(52, 211, 153, 0.4);
      transform: translateY(-1px);
    }
    /* Wide buttons that sit flush with a scrollable panel edge: keep the lift + glow
       but skip the horizontal scale, which used to overflow the panel, spawn a
       horizontal scrollbar and clip the button on hover. */
    .futuristic-button.hover-lift:hover:not(:disabled) {
      transform: translateY(-2px);
    }
    .futuristic-button.hover-lift:focus-visible:not(:disabled) {
      transform: translateY(-2px);
    }
    .futuristic-button:disabled {
      border-color: var(--hairline);
      background-image: none;
      background-color: var(--surface-2);
      color: #9BA3B2; /* muted-text */
      box-shadow: none;
      cursor: not-allowed;
    }
    .futuristic-input {
      background-color: var(--surface-2);
      border: 1px solid var(--hairline-strong);
      color: #E8EAF0; /* light-text */
      transition: border-color 160ms ease, box-shadow 160ms ease, background-color 160ms ease;
    }
    .futuristic-input:focus, .futuristic-input:focus-visible {
      background-color: var(--surface-3);
      border-color: #34D399; /* neon-green */
      box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.28);
      outline: none;
    }
    /* The main game surface: a solid raised panel. No blur, no coloured glow — the
       fill sits above the page and the two-part shadow + hairline carry the depth. */
    .futuristic-card {
      background: var(--surface-1);
      border: 1px solid var(--hairline);
      box-shadow: var(--elev-3);
    }
    /* Results read as a deliberate, static card. The mode colour is already set by the
       caller's border-* classes, so the old cycling rainbow is gone. */
    .results-card-animation {
      box-shadow: var(--elev-3);
    }
    .cat-animation-container {
      z-index: 40; 
      pointer-events: none; 
    }

    /* Styling for select dropdown options */
    select.futuristic-input option {
      background-color: var(--surface-2);
      color: #E8EAF0; /* light-text */
      padding: 8px; /* Add some padding to options */
    }

    select.futuristic-input option:hover {
      background-color: var(--surface-3);
      color: #FFFFFF; /* Brighter text on hover */
    }
    /* For Firefox, which needs a slightly different approach for option background */
    select.futuristic-input:-moz-focusring option {
        background-color: var(--surface-2);
    }
    select.futuristic-input:focus option:checked { /* Style the selected option in the dropdown */
        background: var(--surface-3);
        color: #FFFFFF;
    }
    /* Custom Checkbox Styling */
    .custom-checkbox {
      appearance: none;
      background-color: var(--surface-2);
      border: 1px solid var(--hairline-strong);
      padding: 0;
      display: inline-block;
      position: relative;
      width: 1.25em; /* 20px */
      height: 1.25em; /* 20px */
      border-radius: 6px;
      cursor: pointer;
      margin-right: 0.5em;
      vertical-align: middle;
      transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .custom-checkbox:checked {
      background-color: #34D399; /* neon-green */
      border-color: #34D399;
    }
    .custom-checkbox:checked::after {
      content: '✔';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #0F1216; /* dark-metal for checkmark */
      font-size: 0.875em; /* 14px */
      font-weight: bold;
    }
    .custom-checkbox:focus, .custom-checkbox:focus-visible { /* Added focus-visible */
      outline: none;
      box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.35); /* brand focus ring */
    }
    
    /* Timer freeze chip: a solid sky-tinted badge rather than a glowing gradient. */
    .timer-frozen-display {
      background: rgba(56, 189, 248, 0.16);
      border: 1px solid rgba(56, 189, 248, 0.5);
      border-radius: var(--r-sm);
      padding: 0.1rem 0.4rem; /* Tailwind's px-1.5 py-0.5 roughly */
      box-shadow: inset 0 0 6px rgba(56, 189, 248, 0.15);
      display: inline-flex; 
      align-items: center;
      color: #E8EAF0; /* light-text */
    }

    .word-animation-container {
      position: relative; 
      display: flex; 
      align-items: center;
      justify-content: center;
      width: 100%; 
      height: 100%; /* Ensure it fills parent if parent has defined height */
    }
    
    .timer-rush-hour { /* This style is for the rectangular border around the timer in Normal mode - REMOVED */
      /* border: 2px solid #FF4136; */ /* danger-red */
      /* box-shadow: 0 0 10px 2px rgba(255, 65, 54, 0.6), inset 0 0 8px rgba(255, 65, 54, 0.4); */
      /* animation: pulseOnce 0.7s infinite alternate; */ 
    }

    /* Rush Hour: a clean solid danger border that breathes, instead of animated
       diagonal neon bars. The pulse carries the urgency; the shape stays native. */
    .rush-hour-active-visuals {
      position: relative;
      border: 2px solid #F87171;
      animation: rushHourBorderPulse 1.2s ease-in-out infinite;
    }

    @keyframes rushHourBorderPulse {
      0%, 100% { border-color: rgba(248, 113, 113, 0.55); }
      50% { border-color: rgba(248, 113, 113, 1); }
    }

    /* The word card: the game's hero surface. A crisp brand-tinted edge instead of
       the old flowing rainbow border. */
    .word-card-animated-border {
      position: relative;
      border: 2px solid rgba(52, 211, 153, 0.4) !important; /* Overrides .futuristic-card border */
      background-clip: padding-box !important;
    }
    
    /* Hell Mode Time Bar Styling */
    .hell-mode-timebar-container {
        position: relative;
        background-color: rgb(55 65 81 / 1); /* bg-gray-700 */
        border-radius: 9999px; /* rounded-full */
        height: 0.75rem; /* h-3 */
        box-shadow: inset 0 2px 4px 0 rgb(0 0 0 / 0.05); /* shadow-inner */
        overflow: hidden;
        border: 1px solid var(--hairline-strong);
    }
    .hell-mode-timebar-container.time-depleted-spark::after {
        content: '';
        position: absolute;
        left: 4px;
        top: 50%;
        width: 1rem;
        height: 1rem;
        background: radial-gradient(circle, white, #FFDC00, #FF851B, transparent 70%);
        border-radius: 50%;
        animation: timeDepletedSpark 0.8s ease-out forwards;
    }
    
    /* --- Responsive Layout & Typography --- */
    /* Base font sizes are set via Tailwind classes on elements. The rules below enhance them for fluid scaling. */
    header h1 {
        /* From text-3xl (1.875rem) to md:text-5xl (3rem) */
        font-size: clamp(1.875rem, 6vw, 3rem);
    }
    header p {
        /* From text-md (0.875rem) to sm:text-lg (1.125rem) */
        font-size: clamp(0.875rem, 3vw, 1.125rem);
    }
    main.futuristic-card {
        /* From p-3 (0.75rem) to md:p-6 (1.5rem), with a higher max for large screens */
        padding: clamp(0.75rem, 3vh, 2rem);
    }

    /* --- Component-Specific Responsive Styles --- */
    .instruction-screen-title {
        /* From text-2xl (1.5rem) to sm:text-3xl (1.875rem) */
        font-size: clamp(1.5rem, 5vw, 2.25rem) !important;
    }
    .instruction-screen-content {
        font-size: clamp(0.875rem, 2.5vw, 1.1rem) !important;
    }
    /* Game Setup keeps its own fluid scale so it stays legible on a classroom
       TV, but it is deliberately restrained: labels and fields top out at 18px,
       captions at 16px, so every step still fits one viewport without scrolling.
       Three tiers, in order of hierarchy:
         title 1.75rem  >  label/field/tab 1.125rem  >  caption 1rem  */
    .setup-screen-title {
        font-size: clamp(1.5rem, 3vw, 2rem) !important;
    }
    .setup-screen-label, .setup-screen-input, .setup-screen-checkbox-label, .setup-screen-tab {
        font-size: clamp(0.9375rem, 1.5vw, 1.125rem) !important;
    }
    .setup-screen-small-text {
        font-size: clamp(0.875rem, 1.3vw, 1rem) !important;
    }
    .instruction-buttons button, .home-button {
        font-size: clamp(1rem, 3vw, 1.25rem) !important;
        padding: clamp(0.75rem, 2.5vh, 1.25rem) !important;
    }
    .setup-screen-button {
        font-size: clamp(1rem, 1.6vw, 1.375rem) !important;
        padding: clamp(0.625rem, 2vh, 0.875rem) !important;
    }
    /* Short viewports (720p laptops and projectors): give the wizard back the
       vertical room it needs by compressing the surrounding chrome — the app
       title, the wizard title and the step tabs. Nothing is hidden. */
    @media (max-height: 780px) {
        .container header h1 {
            font-size: clamp(1.5rem, 4.5vh, 2.25rem) !important;
        }
        .container header p {
            font-size: clamp(0.875rem, 2vh, 1.0625rem) !important;
        }
        .setup-screen-title {
            font-size: clamp(1.375rem, 3vh, 1.75rem) !important;
        }
        .setup-screen-tab {
            padding-top: 0.375rem !important;
            padding-bottom: 0.375rem !important;
        }
        /* Reclaim the last few pixels from field padding and card gutters rather
           than from type size, so the text stays at its readable scale. */
        .setup-screen-input {
            padding-top: 0.5rem !important;
            padding-bottom: 0.5rem !important;
        }
        .setup-mode-card {
            padding: 0.375rem !important;
        }
        .setup-mode-card .setup-screen-label {
            margin-bottom: 0.125rem !important;
        }
        /* The demo banner is the tallest block on the Mode step and carries no
           type smaller than the rest, so it is the right place to claw back the
           last few pixels: tighten its shell and close the gap to its perk rows.
           The wizard keeps a real 0.25rem rhythm between steps. */
        .setup-demo-banner {
            padding-top: 0.125rem !important;
            padding-bottom: 0.125rem !important;
        }
        .setup-demo-banner > div + div {
            margin-top: 0 !important;
        }
        .setup-wizard-panel {
            gap: 0.25rem !important;
        }
    }

    .gamescreen-buttons button {
        padding: clamp(0.75rem, 3vh, 1.25rem) !important;
        font-size: clamp(1rem, 3vw, 1.25rem) !important;
    }
    .score-display {
        font-size: clamp(1rem, 3vw, 1.25rem) !important;
    }
    .score-display span {
        font-size: clamp(1.25rem, 4vw, 1.875rem) !important;
    }
    .game-message-display {
        font-size: clamp(1.1rem, 4vw, 1.75rem) !important;
    }
    .hell-mode-timebar-container {
        height: clamp(0.75rem, 2vh, 1.25rem); /* h-3 to h-5 */
    }

    .results-screen-title {
        font-size: clamp(2rem, 6vw, 3.75rem) !important; /* From ~3xl to ~6xl */
    }
    .final-score {
        font-size: clamp(4rem, 18vw, 10rem) !important; /* From ~6xl up */
    }
    .score-breakdown, .compliment-message {
        font-size: clamp(1rem, 3vw, 1.5rem) !important;
    }
    .setup-screen-input {
        padding-top: clamp(0.5rem, 2vh, 1rem) !important;
        padding-bottom: clamp(0.5rem, 2vh, 1rem) !important;
    }
    .custom-checkbox {
        width: clamp(1.25em, 4vw, 1.5em) !important;
        height: clamp(1.25em, 4vw, 1.5em) !important;
    }
    .custom-checkbox:checked::after {
        font-size: clamp(0.875em, 3vw, 1.1em) !important;
    }
    
    /* --- Orientation-Specific Optimizations --- */
    @media (orientation: landscape) and (max-height: 550px) {
        /* Make layout more compact vertically for short, wide screens */
        header {
            margin-bottom: 0.5rem !important; /* Tailwind sm:mb-4 is 1rem */
        }
        header h1 {
            font-size: clamp(1.5rem, 8vh, 2rem) !important;
        }
        header p {
            font-size: clamp(0.75rem, 4vh, 0.875rem) !important;
            margin-top: 0 !important;
            line-height: 1.2;
        }
        footer {
            margin-top: 0.5rem !important;
            flex-direction: row !important;
            flex-wrap: wrap; /* Allow wrapping on very narrow landscape screens */
            justify-content: center;
        }
        main.futuristic-card {
             padding: clamp(0.5rem, 2vh, 1rem) !important;
        }

        /* Reduce button sizes */
        .home-button, .instruction-buttons button, .gamescreen-buttons button {
            padding: clamp(0.5rem, 2vh, 0.75rem) !important;
            font-size: clamp(0.8rem, 3vh, 1rem) !important;
        }
        .setup-screen-button {
            padding: clamp(0.5rem, 2vh, 0.75rem) !important;
            font-size: clamp(1rem, 3vh, 1.25rem) !important;
        }
        
        /* Shrink the giant word/score text based on limited height */
        /* This rule targets the <p> tag generated inside WordCard */
        .word-card-animated-border p {
            font-size: clamp(2rem, 25vh, 6rem) !important;
        }

        .final-score {
            font-size: clamp(3rem, 25vh, 7rem) !important;
        }
    }

    /* --- Fullscreen Mode Overrides --- */
    body.fullscreen-active #root > div {
        padding: 0;
        justify-content: center;
        align-items: center;
    }
    body.fullscreen-active .container {
        width: 100vw;
        height: calc(100vw * 9 / 16);
        max-height: 100vh;
        max-width: calc(100vh * 16 / 9);
        margin: auto;
        padding: 2vmin;
    }
    body.fullscreen-active header {
        margin-bottom: 1vmin !important;
    }
    body.fullscreen-active header h1 {
        font-size: clamp(2rem, 5vmin, 3.5rem) !important;
    }
    body.fullscreen-active header p {
        font-size: clamp(1rem, 2.5vmin, 1.25rem) !important;
    }
    body.fullscreen-active main.futuristic-card {
        padding: clamp(0.5rem, 2vmin, 1.5rem) !important;
    }

    body.fullscreen-active .setup-screen-title {
        font-size: clamp(1.5rem, 2.8vmin, 2rem) !important;
    }
    body.fullscreen-active .setup-screen-label,
    body.fullscreen-active .setup-screen-input,
    body.fullscreen-active .setup-screen-checkbox-label,
    body.fullscreen-active .setup-screen-tab {
        font-size: clamp(0.9375rem, 1.4vmin, 1.125rem) !important;
    }
    body.fullscreen-active .setup-screen-small-text {
        font-size: clamp(0.875rem, 1.2vmin, 1rem) !important;
    }
    body.fullscreen-active .setup-screen-button {
        font-size: clamp(1rem, 1.5vmin, 1.375rem) !important;
        padding: clamp(0.625rem, 1.5vmin, 0.875rem) !important;
    }
    body.fullscreen-active .home-button,
    body.fullscreen-active .gamescreen-buttons button {
        font-size: clamp(1rem, 2.5vmin, 1.25rem) !important;
        padding: clamp(0.75rem, 2vmin, 1.25rem) !important;
    }
    body.fullscreen-active .score-display {
        font-size: clamp(1rem, 2.5vmin, 1.25rem) !important;
    }
    body.fullscreen-active .score-display span {
        font-size: clamp(1.25rem, 3.5vmin, 1.875rem) !important;
    }
    body.fullscreen-active .game-message-display {
        font-size: clamp(1.1rem, 3vmin, 1.75rem) !important;
    }
    body.fullscreen-active .results-screen-title {
        font-size: clamp(2rem, 5vmin, 3.75rem) !important;
    }
    body.fullscreen-active .final-score {
        font-size: clamp(4rem, 18vmin, 10rem) !important;
    }
    body.fullscreen-active .score-breakdown, 
    body.fullscreen-active .compliment-message {
        font-size: clamp(1rem, 3vmin, 1.5rem) !important;
    }

    /* Instruction Screen Font Size Increase for TV Readability */
    body.fullscreen-active .instruction-screen-title {
        font-size: clamp(2rem, 6vmin, 4rem) !important;
    }
    body.fullscreen-active .instruction-screen-content {
        font-size: clamp(1.2rem, 3.5vmin, 2.2rem) !important;
        line-height: 1.6 !important;
    }
    body.fullscreen-active .instruction-screen-content h3 {
        font-size: clamp(1.5rem, 4.5vmin, 2.8rem) !important;
        margin-bottom: 0.75rem !important;
    }
    body.fullscreen-active .instruction-buttons button {
        font-size: clamp(1.2rem, 3vmin, 1.8rem) !important;
        padding: clamp(1rem, 2.5vmin, 2rem) !important;
    }
    
    /* Footer Repositioning for Fullscreen */
    body.fullscreen-active footer {
        position: fixed;
        bottom: 2vmin;
        right: 2vmin;
        width: auto;
        flex-direction: column;
        align-items: flex-end;
        background-color: rgba(21, 26, 32, 0.85); /* surface-1 */
        backdrop-filter: blur(5px);
        padding: 1.5vmin;
        border-radius: var(--r-md);
        border: 1px solid var(--hairline-strong);
        box-shadow: var(--elev-3);
        z-index: 100;
        margin: 0;
    }
    /* Hide non-essential footer elements in fullscreen */
    body.fullscreen-active footer .footer-credit,
    body.fullscreen-active footer .fullscreen-toggle-container {
        display: none;
    }
    /* Adjust the volume controls container */
    body.fullscreen-active footer .volume-controls-container {
        flex-direction: column;
        align-items: flex-end;
        gap: 1vmin;
    }
    body.fullscreen-active footer .volume-control-item {
        width: 100%;
        justify-content: flex-end;
    }
    body.fullscreen-active footer .volume-control-item label {
        font-size: 2vmin;
    }
    body.fullscreen-active footer .volume-control-item input[type="range"] {
        width: 15vmin;
    }
    body.fullscreen-active footer .volume-control-item span {
        font-size: 2vmin;
        width: 6vmin;
    }

  </style>
</head>
<body class="bg-dark-metal text-light-text">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
